name: profecan

# Runs only when something inside profecan/ (or this pipeline) changes.
# React app (create-react-app) -> S3 + CloudFront.
#
# Deploy runs on push to trunk once these repo variables are set:
#   PROFECAN_BUCKET_NAME, PROFECAN_DISTRIBUTION_ID
# (plus the shared secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY and variable REGION)

on:
  push:
    branches: [trunk]
    paths:
      - 'profecan/**'
      - '.github/workflows/profecan.yml'
      - '.github/workflows/_s3-site.yml'
  pull_request:
    branches: [trunk]
    paths:
      - 'profecan/**'
      - '.github/workflows/profecan.yml'
      - '.github/workflows/_s3-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profecan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    uses: ./.github/workflows/_s3-site.yml
    secrets: inherit
    with:
      working-directory: profecan
      node-build: true
      environment: profecan
      bucket: ${{ vars.PROFECAN_BUCKET_NAME }}
      distribution-id: ${{ vars.PROFECAN_DISTRIBUTION_ID }}
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk' && vars.PROFECAN_BUCKET_NAME != '' }}
